<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vendor Onboarding{% endblock %} · Vendor Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">VO</span><span>Vendor Onboarding</span></div>
      <nav class="nav" aria-label="Main">
        {% for key, href, label in nav %}
          <a href="{{ href }}" {% if key == active %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <div class="who">
        Reviewer<strong>{{ reviewer }}</strong>
        {% if auth_enabled %}<a href="/logout" class="small">Sign out</a>{% endif %}
      </div>
    </aside>
    <main class="main" id="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
